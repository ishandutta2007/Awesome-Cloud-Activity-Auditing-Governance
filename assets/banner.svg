<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.4; }
      50% { transform: translateY(-12px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .radar-circle {
      transform-origin: 1020px 210px;
      animation: rotateRadar 24s linear infinite;
    }
    .glow-blob {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 5s ease-in-out 1s infinite; }
    .particle-3 { animation: floatParticle 4.5s ease-in-out 2s infinite; }
    .stream-line {
      stroke-dasharray: 10, 15;
      animation: flowLine 8s linear infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Background Dynamic Glowing Accents (Low Opacity so Foreground Text stays 100% legible) -->
  <circle class="glow-blob" cx="200" cy="100" r="180" fill="#3B82F6" opacity="0.15" filter="url(#glow)"/>
  <circle class="glow-blob" cx="1020" cy="210" r="220" fill="#6366F1" opacity="0.15" filter="url(#glow)"/>
  <circle class="glow-blob" cx="600" cy="350" r="150" fill="#06B6D4" opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Radar / Cyber Security Visual (Right Side Background Element) -->
  <g class="radar-circle" opacity="0.35">
    <circle cx="1020" cy="210" r="140" fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" stroke-dasharray="6,8"/>
    <circle cx="1020" cy="210" r="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="1020" cy="210" r="60" fill="none" stroke="url(#text-grad)" stroke-width="1.5"/>
    <line x1="1020" y1="70" x2="1020" y2="350" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="880" y1="210" x2="1160" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  </g>

  <!-- Animated Data Flow Streams -->
  <path class="stream-line" d="M 50 80 Q 300 20 600 80 T 1150 50" fill="none" stroke="url(#cyan-glow)" stroke-width="2" opacity="0.3"/>
  <path class="stream-line" d="M 50 360 Q 400 400 800 340 T 1150 370" fill="none" stroke="url(#text-grad)" stroke-width="2" opacity="0.3"/>

  <!-- Floating Security Audit Particles -->
  <circle class="particle-1" cx="880" cy="120" r="6" fill="#38BDF8"/>
  <circle class="particle-2" cx="950" cy="280" r="8" fill="#818CF8"/>
  <circle class="particle-3" cx="1080" cy="140" r="5" fill="#C084FC"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#cyan-glow)"/>

  <!-- FOREGROUND CONTENT (Always Sharp, Clear & Unobstructed) -->
  <g filter="url(#shadow)">
    <!-- Badge Indicator -->
    <rect x="80" y="55" width="230" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="95" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1.2">
      🔍 CLOUD SECURITY AUDITING
    </text>

    <!-- Main Title -->
    <text x="80" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#text-grad)" letter-spacing="-0.5">
      Awesome Cloud Activity Auditing
    </text>
    <text x="80" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">
      &amp; Governance Ecosystem 🛡️
    </text>

    <!-- Subtitle -->
    <text x="80" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94A3B8">
      Curated Directory of Commercial Cloud Audit Platforms &amp; Open-Source Security Assessment Tools
    </text>

    <!-- Feature Cards / Badges in Foreground -->
    <!-- Card 1: Cloud Trail Analysis -->
    <g transform="translate(80, 275)">
      <rect width="210" height="64" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38BDF8">☁️ Cloud Trail Logs</text>
      <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">AWS, GCP &amp; Azure Logs</text>
    </g>

    <!-- Card 2: Multi-Cloud CSPM -->
    <g transform="translate(305, 275)">
      <rect width="210" height="64" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#818CF8">🛡️ CSPM &amp; Posture</text>
      <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Automated Security Audits</text>
    </g>

    <!-- Card 3: Continuous Compliance -->
    <g transform="translate(530, 275)">
      <rect width="210" height="64" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#C084FC">⚖️ Compliance</text>
      <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">CIS, SOC2, HIPAA, PCI-DSS</text>
    </g>

    <!-- Card 4: Open Source -->
    <g transform="translate(755, 275)">
      <rect width="210" height="64" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#4ADE80">🔓 Open-Source Tools</text>
      <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Prowler, Trivy, Steampipe</text>
    </g>
  </g>
</svg>
